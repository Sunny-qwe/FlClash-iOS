name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum

      - name: Setup Rust Target for iOS
        run: |
          rustup target add aarch64-apple-ios || true
          rustup toolchain install 1.99.0 --target aarch64-apple-ios || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA (Unsigned)
        run: dart setup.dart ios --no-codesign -v

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-iOS-arm64-unsigned
          path: dist/*.ipa
          if-no-files-found: error
