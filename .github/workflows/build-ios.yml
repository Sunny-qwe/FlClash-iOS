name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum

      - name: Setup Rust Target for iOS
        run: |
          rustup target add aarch64-apple-ios || true
          rustup toolchain install 1.99.0 --target aarch64-apple-ios || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify alternate icon sources
        run: python3 tool/verify_ios_bundle.py --assets ios/Runner/Assets.xcassets

      - name: Verify Dart changes and startup ordering
        run: |
          dart format lib/core/controller.dart lib/providers/actions/setup.dart lib/plugins/service.dart lib/views/config/app_icon.dart lib/views/dashboard/widgets/current_outbound.dart test/core/controller_test.dart test/views/dashboard/status_reference_test.dart setup.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/core/controller.dart lib/providers/actions/setup.dart lib/plugins/service.dart lib/views/config/app_icon.dart lib/views/dashboard/widgets/current_outbound.dart
          flutter test test/core/controller_test.dart test/views/dashboard/current_outbound_test.dart test/views/dashboard/status_reference_test.dart
          flutter test test/setup_test.dart --plain-name 'iOS'

      - name: Build iOS IPA (Unsigned)
        run: dart setup.dart ios --no-codesign -v

      - name: Verify packaged icons and extension entitlements
        run: python3 tool/verify_ios_bundle.py --ipa dist/*.ipa

      - name: Upload dashboard render
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-reference-render
          path: build/verification/status-card.png
          if-no-files-found: error

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-iOS-arm64-unsigned
          path: dist/*.ipa
          if-no-files-found: error
